<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yupoo Finder</title>
  <meta name="theme-color" content="#14121f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yupoo Finder">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <button class="back" id="back" hidden aria-label="Retour">‹</button>
    <h1 id="title">Vendeurs</h1>
    <span class="top-right" id="topRight"></span>
  </header>

  <main id="view"></main>

  <nav class="tabs">
    <a href="#/" data-tab="stores"><span class="ico">▦</span>Vendeurs</a>
    <a href="#/search" data-tab="search"><span class="ico">⌕</span>Recherche</a>
    <a href="#/photo" data-tab="photo"><span class="ico">◉</span>Photo</a>
  </nav>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lbClose" aria-label="Fermer">✕</button>
    <div class="lb-scroll" id="lbScroll"></div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="/stores.js"></script>
  <script src="/app.js"></script>
</body>
</html>
