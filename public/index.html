<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yupoo Finder</title>
  <meta name="theme-color" content="#f4f3fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Yupoo Finder">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <script>
    // applique le thème choisi avant l'affichage (évite un flash de la mauvaise couleur)
    try { var st = JSON.parse(localStorage.getItem("settings") || "{}"); if (st.theme && st.theme !== "auto") document.documentElement.dataset.theme = st.theme; } catch (e) {}
  </script>
</head>
<body class="large">
  <div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="top">
    <button class="back" id="back" hidden aria-label="Retour">
      <svg viewBox="0 0 13 21" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2 3 10.5 11 19"/></svg>
      <span id="backLbl">Retour</span>
    </button>
    <h1 id="title"></h1>
    <span class="top-right" id="topRight"></span>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs"></nav>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lbClose" aria-label="Fermer">✕</button>
    <div class="lb-scroll" id="lbScroll"></div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="/stores.js"></script>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
