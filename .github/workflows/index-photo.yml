# Reconstruit chaque nuit l'index de la recherche par photo et le publie
# dans la release GitHub « index » (lue par l'appli via /index/meta.json et /index/vecs.bin).
name: Index photo

on:
  schedule:
    - cron: "17 2 * * *" # chaque nuit vers 3h-4h (heure de Paris)
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Pages de 120 albums par vendeur"
        default: "15"

permissions:
  contents: write

concurrency:
  group: index-photo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: indexer/package-lock.json

      - run: npm ci

      - name: Cache du modèle
        uses: actions/cache@v4
        with:
          path: indexer/node_modules/@huggingface/transformers/.cache
          key: model-dinov2-small-q8

      - name: Construire l'index
        run: node build-index.mjs
        env:
          MAX_PAGES: ${{ inputs.max_pages || '15' }}

      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view index >/dev/null 2>&1 || \
            gh release create index --title "Index photo" --notes "Mis à jour automatiquement chaque nuit." --latest=false
          gh release upload index ../out/meta.json ../out/vecs.bin --clobber
